name: Android APK derle

# Bilgisayar gerektirmeden APK üretmek için: bu iş akışını GitHub'ın
# kendi sunucularında (bulutta) çalıştırır. Actions sekmesinden elle
# tetiklenebilir (workflow_dispatch) ya da bu branch'e her push'ta otomatik
# çalışır. Bitince üretilen APK, çalışan işin sayfasındaki "Artifacts"
# bölümünden indirilebilir (telefon tarayıcısından da).
on:
  workflow_dispatch:
  push:
    branches: [claude/uber-like-taxi-app-vpixil]
    paths:
      - "frontend/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # DATABASE_URL burada gerçekten kullanılmıyor (bu workflow backend'i
      # hiç çalıştırmıyor) ama npm workspaces kurulumu backend'in
      # "postinstall" (prisma generate) betiğini de tetikliyor ve o betik
      # bu değişken tanımlı değilse hata veriyor.
      - name: Bağımlılıkları kur
        env:
          DATABASE_URL: "file:./dev.db"
        run: npm install

      - name: Frontend'i derle
        run: npm run build --workspace frontend

      - name: Capacitor senkronize et
        run: npx cap sync android
        working-directory: frontend

      - name: Gradle'a çalıştırma izni ver
        run: chmod +x android/gradlew
        working-directory: frontend

      - name: Debug APK derle
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: yol-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      # "apk-latest" sabit bir tag'e her seferinde yeniden yayınlanır, bu
      # yüzden indirme linki hiç değişmez — kullanıcı sürekli aynı adresten
      # (Ayarlar/Bildirim menüsündeki "Uygulamayı Güncelle" linki) en güncel
      # APK'yı indirebilir.
      - name: Sabit sürüme yayınla (apk-latest)
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk yol.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest yol.apk \
            --title "YOL - Güncel APK" \
            --notes "Otomatik olarak her push'ta güncellenir. Commit: ${{ github.sha }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
